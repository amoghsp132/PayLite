<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paylite Payment Gateway</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/widget.css') }}">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    .pay-btn{
      padding:12px 18px;
      border:none;
      border-radius:6px;
      color:#fff;
      font-size:1rem;
      cursor:pointer;
      width:100%;
      margin-top:10px;
    }
    .input{
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:6px;
      border:1px solid #ccc;
      font-size:1rem;
    }
  </style>
</head>

<body>
<div class="payment-container">

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
  <h3>Payment Methods</h3>
  <div class="method" data-method="card">
    <i class="fa fa-credit-card"></i> Card
  </div>
  <div class="method active" data-method="qr">
    <i class="fa fa-qrcode"></i> QR / UPI
  </div>
</div>

<!-- ================= FORM AREA ================= -->
<div class="form-area" id="formArea"></div>

<!-- ================= SUMMARY ================= -->
<div class="summary">
  <h4>Payee</h4>
  <p>{{ payee_name }}</p>

  <h4>Order ID</h4>
  <p id="orderId">{{ order_id }}</p>

  <h4>Payment ID</h4>
  <p id="txnId" style="opacity:.8;">{{ intent_id }}</p>

  <h4>Amount</h4>
  <p class="amount">
    {% if amount and amount != "0.00" %}₹{{ amount }}{% else %}—{% endif %}
  </p>

  <div id="timer"
       style="margin-top:1rem;font-size:1.2rem;font-weight:600;">10:00</div>

  <p style="color:red;text-align:center;margin-top:1rem;">
    DO NOT REFRESH THIS PAGE
  </p>
</div>

</div>

<script>
/* ================= DATA ================= */
const ORDER_ID    = "{{ order_id }}";
const DEFAULT_AMT = "{{ amount }}";
const PAYEE_UPI   = "{{ payee_upi }}";

/* ================= TIMER ================= */
let t = 600;
const timer = document.getElementById("timer");
const iv = setInterval(()=>{
  t--;
  timer.textContent =
    `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
  if(t <= 0){
    clearInterval(iv);
    alert("❌ Session expired");
    location="/localMart";
  }
},1000);

/* ================= FORMS ================= */
const forms = {
  qr: `
    <h2>Scan & Pay</h2>
    <div style="text-align:center">
      <img src="{{ qr_code | safe }}" style="width:250px;height:250px"/>
      <p>Scan using any UPI app</p>
    </div>

    <button class="pay-btn" style="background:#2ecc71"
      onclick="manualResult('success')">
      ✅ Mark Payment Successful
    </button>

    <button class="pay-btn" style="background:#f1c40f;color:#000"
      onclick="manualResult('pending')">
      🕒 Mark Payment Pending
    </button>

    <button class="pay-btn" style="background:#e74c3c"
      onclick="manualResult('failed')">
      ❌ Mark Payment Failed
    </button>
  `,

  card: `
    <h2>Card Payment</h2>

    <input class="input" id="card_no"
      placeholder="Card Number (16 digits)"
      maxlength="16"
      inputmode="numeric">

    <input class="input" id="exp_date"
      placeholder="MM / YY"
      maxlength="5"
      inputmode="numeric">

    <input class="input" id="cvv"
      placeholder="CVV"
      maxlength="3"
      inputmode="numeric">

    <button class="pay-btn" style="background:#3498db"
      onclick="payByCard()">
      💳 Pay ₹${DEFAULT_AMT || "0.00"}
    </button>
  `
};

const formArea = document.getElementById("formArea");
formArea.innerHTML = forms.qr;

/* ================= SIDEBAR ================= */
document.querySelectorAll(".method").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".method").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    formArea.innerHTML = forms[btn.dataset.method];
    attachInputGuards();
  };
});

/* ================= INPUT GUARDS ================= */
function attachInputGuards(){
  const card = document.getElementById("card_no");
  const exp  = document.getElementById("exp_date");
  const cvv  = document.getElementById("cvv");

  if(card){
    card.oninput = ()=> card.value = card.value.replace(/\D/g,"").slice(0,16);
  }
  if(exp){
    exp.oninput = ()=>{
      let v = exp.value.replace(/\D/g,"").slice(0,4);
      if(v.length >= 3) v = v.slice(0,2) + "/" + v.slice(2);
      exp.value = v;
    };
  }
  if(cvv){
    cvv.oninput = ()=> cvv.value = cvv.value.replace(/\D/g,"").slice(0,3);
  }
}

/* ================= CARD PAYMENT ================= */
async function payByCard(){
  const expRaw = document.getElementById("exp_date").value;
  if(!/^\d{2}\/\d{2}$/.test(expRaw)){
    alert("❌ Invalid expiry format");
    return;
  }

  const [mm, yy] = expRaw.split("/");
  const payload = {
    method: "card",
    amount: Number(DEFAULT_AMT || 0),
    to_upi: PAYEE_UPI,
    order_id: ORDER_ID,
    card_no: document.getElementById("card_no").value,
    cvv: document.getElementById("cvv").value,
    exp_date: `${mm}/20${yy}`
  };

  const r = await fetch("/api/widget/pay",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  });

  const j = await r.json();

  if(j.ok){
    document.getElementById("txnId").textContent = j.txn_id;

    window.parent.postMessage({
      source: "paylite-widget",
      order_id: j.order_id,
      txn_id: j.txn_id,
      status: "success"
    }, "*");

    alert(`✅ PAYMENT SUCCESSFUL\nTxn ID: ${j.txn_id}`);
    setTimeout(()=>location="/localMart",1200);
  }else{
    window.parent.postMessage({
      source: "paylite-widget",
      order_id: ORDER_ID,
      status: "failed"
    }, "*");

    alert("❌ Payment failed: " + (j.error || "Unknown error"));
  }
}

/* ================= MANUAL RESULT ================= */
async function manualResult(status){
  const r = await fetch("/api/widget/manual-result",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      status,
      amount: DEFAULT_AMT || 0,
      order_id: ORDER_ID,
      payee_upi: PAYEE_UPI
    })
  });

  const j = await r.json();
  if(!j.ok){
    alert("❌ Error processing transaction");
    return;
  }

  window.parent.postMessage({
    source: "paylite-widget",
    order_id: ORDER_ID,
    txn_id: j.txn_id || null,
    status: status
  }, "*");

  if(status === "success"){
    document.getElementById("txnId").textContent = j.txn_id;
    alert(`✅ PAYMENT SUCCESSFUL\nTxn ID: ${j.txn_id}`);
  } else if(status === "pending"){
    document.getElementById("txnId").textContent = "PENDING";
    alert("🕒 PAYMENT PENDING");
  } else {
    alert("❌ PAYMENT FAILED");
  }

  setTimeout(()=>location="/localMart",1200);
}
</script>
</body>
</html>
