<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureBank | Account Verification</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Poppins",sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(120deg,#0d6efd,#6610f2,#aa10f2);
}

/* Page Center */
.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Layout */
.container{
  width:90%;
  max-width:1100px;
  background:#fff;
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:40px;
  padding:40px;
  border-radius:10px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}

/* LEFT */
.left{
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.left h1{
  font-size:32px;
  margin-bottom:20px;
}

.card-preview{
  width:360px;
  aspect-ratio:16/10;
  background:linear-gradient(135deg,#1b1f3b,#2c2f63);
  border-radius:18px;
  padding:22px;
  color:#fff;
  position:relative;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}

.card-chip{
  width:52px;
  height:38px;
  background:linear-gradient(135deg,#f9d976,#f39f0b);
  border-radius:6px;
}

.card-number{
  margin-top:28px;
  font-family:"Orbitron",sans-serif;
  font-size:20px;
  letter-spacing:3px;
}

.card-footer{
  position:absolute;
  bottom:18px;
  left:22px;
  right:22px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
}

/* RIGHT */
.right{
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.form-group{
  margin-bottom:16px;
}

label{
  font-size:14px;
  font-weight:500;
  display:block;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:13px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:15px;
}

input:focus{
  outline:none;
  border-color:#6610f2;
}

.row{
  display:flex;
  gap:14px;
}

button{
  margin-top:18px;
  padding:15px;
  font-size:17px;
  border:none;
  border-radius:6px;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(120deg,#0d6efd,#6610f2,#aa10f2);
}

button:hover{
  opacity:.9;
}

#output{
  margin-top:16px;
  font-weight:500;
}

@media(max-width:900px){
  .container{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="page">
  <div class="container">

    <!-- LEFT -->
    <div class="left">
      <h1>TestBank</h1>

      <div class="card-preview">
        <div class="card-chip"></div>
        <div class="card-number" id="displayCard">•••• •••• •••• ••••</div>
        <div class="card-footer">
          <div>VALID THRU</div>
          <div id="displayExpiry">MM/YY</div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <form onsubmit="event.preventDefault(); verifyAccount();">

        <div class="form-group">
          <label>Card Number</label>
          <input id="card" maxlength="19" required>
        </div>

        <div class="row">
          <div class="form-group">
            <label>Expiry (MM/YY)</label>
            <input id="exp" maxlength="5" required>
          </div>
          <div class="form-group">
            <label>CVV</label>
            <input id="cvv" maxlength="3" required>
          </div>
        </div>

        <div class="form-group">
          <label>UPI ID</label>
          <input id="upi" required>
        </div>

        <div class="form-group">
          <label>Bank Account Number</label>
          <input id="acc" required>
        </div>

        <button type="submit">Verify Account</button>
      </form>

      <div id="output"></div>
    </div>

  </div>
</div>

<script>
const BASE = "http://127.0.0.1:5000";

/* Live card formatting */
card.addEventListener("input", e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,16);
  v = v.replace(/(.{4})/g,'$1 ').trim();
  e.target.value = v;
  displayCard.textContent = v || "•••• •••• •••• ••••";
});

exp.addEventListener("input", e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,4);
  if(v.length > 2) v = v.slice(0,2) + "/" + v.slice(2);
  e.target.value = v;
  displayExpiry.textContent = v || "MM/YY";
});

/* MAIN VERIFY */
async function verifyAccount(){
  const output = document.getElementById("output");
  output.style.color = "#00ffcc";
  output.textContent = "Verifying details...";

  const payload = {
    card_no: card.value.replace(/\D/g,''),
    cvv: cvv.value.trim(),
    exp_date: exp.value.trim(),
    upi_id: upi.value.trim(),
    bank_account_no: acc.value.trim()
  };

  try{
    const res = await fetch(`${BASE}/api/account/verify`,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(data.verified){
      output.style.color = "green";
      output.textContent = "Account verified successfully. Redirecting...";
      setTimeout(()=>window.location.href="/dashboard",2000);
    }else{
      output.style.color = "red";
      output.textContent = "Incorrect details entered.";
    }
  }catch(err){
    output.style.color = "red";
    output.textContent = "Server error. Try again.";
  }
}
</script>

</body>
</html>
